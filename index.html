<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería Industrial en Querétaro | SIECO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --water-blue: #00b4d8;
            --water-light: #48cae4;
            --water-deep: #0077b6;
            --water-dark: #03045e;
            --foam: #caf0f8;
        }
        body { font-family: 'IBM Plex Sans', sans-serif; background: #001219; color: #333; overflow-x: hidden; }

        /* --- CORRECCIÓN DE Z-INDEX PARA EL NAV --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            z-index: 9999; /* Máxima prioridad */
            border-bottom: 2px solid rgba(0, 180, 216, 0.25);
            height: 90px;
        }

        /* Fondo - Enviado detrás de todo */
        #waterCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; 
        }

        .water-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 18, 25, 0.3) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .nav-container {
            max-width: 1400px; margin: 0 auto; padding: 0 40px;
            display: flex; justify-content: space-between; align-items: center; height: 100%;
        }

        /* --- RESTO DE TU CSS ORIGINAL SIN MODIFICAR --- */
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 64px; width: auto; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { text-decoration: none; color: #001219; font-weight: 500; text-transform: uppercase; }
        .content { position: relative; z-index: 10; padding-top: 100px; }
        
        /* Incluye aquí el resto de tus estilos (Orbit, Hero, Cards, Footer, etc.) */
    </style>
</head>
<body>
    <canvas id="waterCanvas"></canvas>
    <div class="water-overlay"></div>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="https://raw.githubusercontent.com/theapistoremail-bit/SIECO2/main/Dise%C3%B1o%20sin%20t%C3%ADtulo%20(9).png" alt="SIECO Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="agua.html">Soluciones En Agua</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <div class="content">
        <section class="hero">
            <h1>BIENVENIDOS A SIECO</h1>
            <p>Ingeniería industrial, purificación y control eléctrico.</p>
        </section>
    </div>

    <script>
        // WebGL background logic ...
        // (Tu script original aquí)
    </script>
</body>
</html>
