<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soluciones En Agua - SIECO</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --water-blue: #00b4d8;
            --water-light: #48cae4;
            --water-deep: #0077b6;
            --water-dark: #03045e;
            --foam: #caf0f8;
        }
        body { font-family: 'IBM Plex Sans', sans-serif; background: #001219; color: #333; overflow-x: hidden; }
        #waterCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .water-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,18,25,0.3) 100%);
            z-index: 1; pointer-events: none;
        }

        /* NAV — canon */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0,180,216,0.1);
            z-index: 1000;
            border-bottom: 2px solid rgba(0,180,216,0.2);
        }
        .nav-container {
            max-width: 1400px; margin: 0 auto;
            padding: 0 40px;
            display: flex; justify-content: space-between; align-items: center;
            height: 90px;
        }
        .nav-logo img { height: 135px; width: auto; display: block; }
        .nav-links { display: flex; gap: 11px; list-style: none; align-items: center; }
        .nav-links a {
            text-decoration: none; color: #001219;
            font-weight: 500; font-size: 0.82em;
            transition: all 0.3s; position: relative;
            letter-spacing: 0.6px; text-transform: uppercase;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 0; height: 2px; background: var(--water-blue); transition: width 0.3s;
        }
        .nav-links a:hover { color: var(--water-deep); }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a.active { color: var(--water-blue); font-weight: 600; }
        .nav-links a.active::after { width: 100%; }

        .hamburger {
            display: none; flex-direction: column; gap: 5px;
            cursor: pointer; padding: 5px; background: none; border: none;
        }
        .hamburger span {
            display: block; width: 24px; height: 2px;
            background: #001219; border-radius: 2px; transition: all 0.3s;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .mobile-menu {
            display: none; position: fixed; top: 90px; left: 0; width: 100%;
            background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
            z-index: 999; padding: 20px 40px 30px;
            box-shadow: 0 10px 30px rgba(0,180,216,0.15);
            border-bottom: 2px solid rgba(0,180,216,0.2);
        }
        .mobile-menu.open { display: flex; flex-direction: column; }
        .mobile-menu a {
            text-decoration: none; color: #001219; font-weight: 500;
            font-size: 1em; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 14px 0; border-bottom: 1px solid rgba(0,180,216,0.1); transition: color 0.2s;
        }
        .mobile-menu a:hover { color: var(--water-blue); }

        /* CONTENT */
        .content { position: relative; z-index: 10; padding-top: 100px; }

        .page-header {
            max-width: 1400px; margin: 0 auto;
            padding: 80px 40px 60px; text-align: center;
        }
        .page-header h1 {
            font-size: 4em; font-weight: 300; color: white;
            margin-bottom: 20px; letter-spacing: -1px;
            text-shadow: 0 4px 30px rgba(0,180,216,0.5);
        }
        .page-header h1 strong {
            font-weight: 600;
            background: linear-gradient(135deg, var(--water-light), var(--foam));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .page-header p {
            font-size: 1.15em; font-weight: 300;
            color: rgba(255,255,255,0.9); max-width: 750px;
            margin: 0 auto; line-height: 1.8;
        }

        .section { max-width: 1400px; margin: 60px auto; padding: 0 40px; }

        .intro-box {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 50px;
            box-shadow: 0 10px 40px rgba(0,180,216,0.15);
            border: 2px solid rgba(72,202,228,0.2); margin-bottom: 60px;
        }
        .intro-box h2 { font-size: 2.2em; color: var(--water-dark); margin-bottom: 20px; }
        .intro-box p { font-size: 1.1em; line-height: 1.8; color: #2c3e50; margin-bottom: 15px; }

        .process-section { margin: 80px 0; }
        .process-title {
            text-align: center; font-size: 3em; color: white;
            margin-bottom: 50px; text-shadow: 0 2px 20px rgba(0,180,216,0.5);
        }

        .stage-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 40px; margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,180,216,0.15);
            border-left: 6px solid var(--water-blue); transition: all 0.3s;
        }
        .stage-card:hover { transform: translateX(10px); box-shadow: 0 15px 50px rgba(0,180,216,0.25); }
        .stage-number {
            display: inline-block; width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--water-blue), var(--water-deep));
            color: white; border-radius: 50%; text-align: center;
            line-height: 60px; font-size: 1.8em; font-weight: 700;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,180,216,0.4);
        }
        .stage-card h3 { font-size: 1.8em; color: var(--water-dark); margin-bottom: 15px; }
        .stage-card p { font-size: 1em; color: #2c3e50; line-height: 1.7; margin-bottom: 15px; }
        .stage-card ul { list-style: none; padding-left: 0; }
        .stage-card ul li {
            padding: 8px 0 8px 30px; position: relative;
            color: #2c3e50; line-height: 1.6;
        }
        .stage-card ul li::before { content: "✓"; position: absolute; left: 0; color: var(--water-blue); font-weight: bold; }

        .benefits-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; margin: 60px 0;
        }
        .benefit-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 35px; text-align: center;
            box-shadow: 0 8px 30px rgba(0,180,216,0.15);
            border: 2px solid rgba(72,202,228,0.2); transition: all 0.3s;
        }
        .benefit-card:hover { transform: translateY(-10px); box-shadow: 0 15px 45px rgba(0,180,216,0.3); }
        .benefit-icon { font-size: 3em; margin-bottom: 20px; }
        .benefit-card h4 { font-size: 1.4em; color: var(--water-dark); margin-bottom: 15px; }
        .benefit-card p { color: #2c3e50; line-height: 1.6; }

        /* UNIFICACIÓN DE CONTENEDORES PARA EVITAR DESFASES */
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 45px rgba(0,180,216,0.3); }
        
        .product-image { 
            height: 180px; 
            width: 100%; 
            border-radius: 12px; 
            background: rgba(0, 180, 216, 0.08); 
            border: 1px solid rgba(0, 180, 216, 0.15);
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3.5em; 
            overflow: hidden; 
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 12px;
        }

        .product-card h4 { font-size: 1.3em; color: var(--water-dark); margin-bottom: 12px; }
        
        .product-card p { 
            color: #2c3e50; 
            font-size: 0.95em; 
            line-height: 1.6; 
            margin-bottom: 20px; 
            flex-grow: 1; 
        }
        
        .product-btn { display: inline-block; padding: 10px 24px; background: var(--water-blue); color: white; text-decoration: none; border-radius: 30px; font-weight: 500; font-size: 0.9em; transition: background 0.3s; margin-top: auto; }
        .product-btn:hover { background: var(--water-deep); }

        /* FOOTER */
        footer { background: #00090d; border-top: 2px solid rgba(0,180,216,0.2); padding: 60px 40px 30px; color: rgba(255,255,255,0.7); position: relative; z-index: 10; }
        .footer-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px; }
        .footer-col h5 { color: white; font-size: 1.2em; margin-bottom: 20px; }
        .footer-col p { line-height: 1.7; font-size: 0.95em; }
        .footer-links { list-style: none; }
        .footer-links li { margin-bottom: 12px; }
        .footer-links a { color: rgba(255,255,255,0.7); text-decoration: none; transition: color 0.3s; }
        .footer-links a:hover { color: var(--water-blue); }
